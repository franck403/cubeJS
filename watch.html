<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clockstar — Control Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    :root *:not(.fa-solid) {
      font-family: "Comfortaa", sans-serif;
      font-optical-sizing: auto;
      font-weight: 800;
      font-style: normal;
    }

    :root {
      --dim: Black;
      --accent: #39adad;
      --yellow: #ffd500;
      --ok: #3fb950;
      --danger: #e5534b;
      --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      color: white;
      overflow-x: hidden;
    }

    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 110px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 100%;
    }

    /* Top bar, styled like .controls.topBar */
    header.controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: calc(100% - 32px);
      max-width: 690px;
      height: 70px;
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translate(-50%, 0%);
      padding: 0 20px;
      border-radius: 51px;
      background: #114B5F;
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: White;
    }

    header h1 span {
      color: var(--dim);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Buttons, matching .btn / .controls button pill style */
    .controlsRow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font-family: "Comfortaa", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      border: none;
      margin: 0;
      background: #020202;
      cursor: pointer;
      height: 50px;
      padding: 0 22px;
      border-radius: 60px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      opacity: 0.85;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button.primary {
      background: #114B5F;
      color: #39ADAD;
    }

    button.ghost {
      background: #ffe98a;
      color: Black;
    }

    button.yellow {
      background: #7A306C;
      color: White;
    }

    /* Cards, matching .btn.bat / .stats block feel */
    .card {
      background: #fccd03;
      border-radius: 24px;
      padding: 18px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .log-header h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: black;
      margin: 0;
    }

    .log-header button {
      padding: 6px 16px;
      font-size: 12px;
      height: 34px;
    }

    #log {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 12.5px;
      line-height: 1.55;
      background: #ffe98a;
      border-radius: 16px;
      padding: 12px 14px;
      height: 340px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #log .line {
      display: flex;
      gap: 8px;
    }

    #log .ts {
      color: rgb(49, 49, 49);
      flex-shrink: 0;
    }

    #log .raw {
      color: Black;
    }

    #log .empty-hint {
      color: var(--dim);
    }

    .autoscroll-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--dim);
      user-select: none;
    }

    footer {
      text-align: center;
      font-size: 11.5px;
      color: var(--dim);
      padding-bottom: 10px;
    }

    .unsupported {
      background: #7A306C;
      color: #FF84E8;
      border-radius: 24px;
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden, 
    .hidden * {
      display: none !important;
      opacity: 0;
    }

    :disabled {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="innerBody">
    <header class="controls">
      <h1>Robot Gan Spike</h1>

      <div class="controlsRow">
        <button id="connectBtn" class="yellow"><i class="fa-solid fa-plug"></i> Connecter</button>
        <button id="disconnectBtn" disabled><i class="fa-solid fa-right-to-bracket"></i> Déconnecter</button>
      </div>
    </header>

    <div id="app hidden">
      <div id="unsupportedNotice" class="unsupported" style="display: none">
        Web Bluetooth n'est pas disponible dans ce navigateur (nécessite
        Chrome/Edge sur desktop ou Android, en HTTPS ou localhost). Safari et
        Firefox ne sont pas supportés.
      </div>
      <div class="card hidden">
        <div class="log-header">
          <h2>Commandes</h2>
          <div style="display: flex; align-items: center; gap: 14px">
            <label class="autoscroll-toggle hidden">
              <input type="checkbox" id="autoscrollChk" checked />
              auto-scroll
            </label>
            <button id="clearBtn" class="ghost">Effacer</button>
          </div>
        </div>
        <div id="log">
          <div class="empty-hint hidden">
            Connecte-toi pour voir les lignes reçues de la montre…
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
      const NUS_TX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // watch -> site (notify)
      const NUS_RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // site -> watch (unused here, receive-only)

      const el = {
        connectBtn: document.getElementById('connectBtn'),
        disconnectBtn: document.getElementById('disconnectBtn'),
        clearBtn: document.getElementById('clearBtn'),
        statusText: document.getElementById('statusText'),
        log: document.getElementById('log'),
        autoscrollChk: document.getElementById('autoscrollChk'),
        unsupportedNotice: document.getElementById('unsupportedNotice'),
      };

      let device = null;
      let rxBuf = ''; // accumulates partial notify chunks until a \n is found
      let logHasContent = false;

      function setStatus(state, text) {
        return;
      }

      function pad(n) {
        return n.toString().padStart(2, '0');
      }

      function appendLogLine(raw) {
        if (!logHasContent) {
          el.log.innerHTML = '';
          logHasContent = true;
        }
        const now = new Date();
        const ts =
          pad(now.getHours()) +
          ':' +
          pad(now.getMinutes()) +
          ':' +
          pad(now.getSeconds());
        const row = document.createElement('div');
        row.className = 'line';
        const tsSpan = document.createElement('span');
        tsSpan.className = 'ts';
        tsSpan.textContent = ts;
        const rawSpan = document.createElement('span');
        rawSpan.className = 'raw';
        rawSpan.textContent = raw;
        row.appendChild(tsSpan);
        row.appendChild(rawSpan);
        el.log.appendChild(row);
        if (el.autoscrollChk.checked) {
          el.log.scrollTop = el.log.scrollHeight;
        }
      }

      function handleIncomingLine(line) {
        if (!line) return;
        appendLogLine(line);
      }

      const bc = new BroadcastChannel(localStorage.bc);
      console.log(bc);

      function handleNotify(event) {
        const value = event.target.value; // DataView
        const chunk = new TextDecoder('utf-8').decode(value);
        rxBuf += chunk;
        let idx;
        while ((idx = rxBuf.indexOf('\n')) !== -1) {
          let line = rxBuf.slice(0, idx);
          rxBuf = rxBuf.slice(idx + 1);
          if (line.endsWith('\r')) line = line.slice(0, -1);
          handleIncomingLine(line);
          bc.postMessage('Watch: ' + line);
        }
      }

      function onDisconnected() {
        setStatus('', 'Déconnecté');
        el.connectBtn.disabled = false;
        el.disconnectBtn.disabled = true;
        device = null;
        rxBuf = '';
      }

      async function connect() {
        if (!navigator.bluetooth) {
          el.unsupportedNotice.style.display = 'block';
          return;
        }
        el.connectBtn.disabled = true;
        setStatus('connecting', 'Recherche…');
        try {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [NUS_SERVICE] }],
            optionalServices: [NUS_SERVICE],
          });

          device.addEventListener('gattserverdisconnected', onDisconnected);

          setStatus('connecting', 'Connexion…');
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(NUS_SERVICE);
          const txChar = await service.getCharacteristic(NUS_TX_CHAR);

          await txChar.startNotifications();
          txChar.addEventListener('characteristicvaluechanged', handleNotify);

          setStatus(
            'connected',
            'Connecté' + (device.name ? ' · ' + device.name : '')
          );
          el.disconnectBtn.disabled = false;
        } catch (err) {
          console.error(err);
          setStatus('error', err.message || 'Échec de connexion');
          el.connectBtn.disabled = false;
        }
      }

      async function disconnect() {
        if (device && device.gatt.connected) {
          device.gatt.disconnect();
        } else {
          onDisconnected();
        }
      }

      function clearLog() {
        logHasContent = false;
        el.log.innerHTML = '<div class="empty-hint">Journal effacé.</div>';
      }

      el.connectBtn.addEventListener('click', connect);
      el.disconnectBtn.addEventListener('click', disconnect);
      el.clearBtn.addEventListener('click', clearLog);

      if (!navigator.bluetooth) {
        el.unsupportedNotice.style.display = 'block';
        el.connectBtn.disabled = true;
      }
    })();
  </script>
</body>

</html>
